apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: 905765459973.dkr.ecr.us-east-2.amazonaws.com/worker:latest
        env:
        - name: REDIS_ADDR
          value: "redis:6379"